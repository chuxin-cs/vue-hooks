<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script>

    function generateChannelUrls(inputUrl, count) {
      const domains = [
        'video1.tcgjcx.com',
        'video2.tcgjcx.com',
        'video.tcgjcx.com',
      ]
      const baseUrl = new URL(inputUrl)
      const results = []
      /**
       * 匹配：
       * 014703238299-2-h.flv
       * 014703238299-2.flv
       */
      const match = baseUrl.pathname.match(
        /^(.*?)-(\d+)(-[^.]+)?\.flv$/
      )
      if (!match) {
        throw new Error('无法解析通道号，请检查 URL 结构')
      }
      const basePath = match[1]           // /live/014703238299
      const extra = match[3] || ''         // -h / -l / '' 
      const suffix = '.flv'
      for (let i = 1; i <= count; i++) {
        const url = new URL(baseUrl.toString())

        url.host = domains[(i - 1) % domains.length]
        url.pathname = `${basePath}-${i}${extra}${suffix}`
        console.log(url.toString())
        results.push(url.toString())
      }
      return results.join(" ")
    }
    console.log(generateChannelUrls(``, 8))
  </script>

</body>

</html>
