<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLV多通道链接生成工具</title>
  <style>
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    textarea, input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    /* 模拟图片类型输入框的样式 */
    #resultUrls {
      min-height: 200px;
      background-color: #f8f9fa;
      border: 1px dashed #ccc;
      cursor: text;
      margin-bottom: 8px; /* 给复制按钮留出间距 */
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    /* 复制按钮样式区分 */
    #copyBtn {
      background-color: #28a745;
    }
    #copyBtn:hover {
      background-color: #218838;
    }
    .error {
      color: #dc3545;
      margin-top: 10px;
    }
    /* 提示信息样式 */
    .tip {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      display: none;
    }
    .success-tip {
      color: #155724;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
    }
    .fail-tip {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>FLV多通道链接生成工具</h2>
    <div class="form-group">
      <label for="sourceUrl">原始FLV链接：</label>
      <textarea id="sourceUrl" placeholder="请粘贴你的原始FLV链接到这里"></textarea>
    </div>
    <div class="form-group">
      <label for="channelCount">生成通道数量：</label>
      <input type="number" id="channelCount" value="8" min="1" max="30">
    </div>
    <button id="generateBtn">生成通道链接</button>
    <div class="form-group" style="margin-top: 20px;">
      <label for="resultUrls">生成结果（可直接复制）：</label>
      <textarea id="resultUrls" readonly placeholder="生成的多通道链接会显示在这里"></textarea>
      <!-- 新增复制按钮 -->
      <button id="copyBtn">复制生成结果</button>
      <!-- 复制提示信息 -->
      <div id="copyTip" class="tip"></div>
    </div>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const sourceUrlEl = document.getElementById('sourceUrl');
      const channelCountEl = document.getElementById('channelCount');
      const generateBtn = document.getElementById('generateBtn');
      const resultUrlsEl = document.getElementById('resultUrls');
      const errorMsgEl = document.getElementById('errorMsg');
      // 新增复制按钮和提示元素
      const copyBtn = document.getElementById('copyBtn');
      const copyTipEl = document.getElementById('copyTip');

      function generateChannelUrls(inputUrl, count) {
        const domains = [
          'video1.tcgjcx.com',
          'video2.tcgjcx.com',
          'video.tcgjcx.com',
        ];
        const baseUrl = new URL(inputUrl);
        const results = [];
        const match = baseUrl.pathname.match(/^(.*?)-(\d+)(-[^.]+)?\.flv$/);
        
        if (!match) {
          throw new Error('无法解析通道号，请检查URL是否包含“xxx-数字(-后缀).flv”格式');
        }

        const basePath = match[1];
        const extra = match[3] || '';
        const suffix = '.flv';

        for (let i = 1; i <= count; i++) {
          const url = new URL(baseUrl.toString());
          url.host = domains[(i - 1) % domains.length];
          url.pathname = `${basePath}-${i}${extra}${suffix}`;
          results.push(url.toString());
        }
        return results.join('\n');
      }

      // 新增复制功能函数
      function copyResultContent() {
        // 清空之前的提示
        copyTipEl.style.display = 'none';
        copyTipEl.className = 'tip';
        
        // 获取要复制的内容
        const content = resultUrlsEl.value.trim();
        
        // 检查内容是否为空
        if (!content) {
          copyTipEl.textContent = '暂无内容可复制，请先生成通道链接';
          copyTipEl.className = 'tip fail-tip';
          copyTipEl.style.display = 'block';
          // 3秒后隐藏提示
          setTimeout(() => {
            copyTipEl.style.display = 'none';
          }, 3000);
          return;
        }

        // 使用剪贴板API复制内容
        navigator.clipboard.writeText(content)
          .then(() => {
            // 复制成功提示
            copyTipEl.textContent = '复制成功！内容已保存到剪贴板';
            copyTipEl.className = 'tip success-tip';
            copyTipEl.style.display = 'block';
          })
          .catch(err => {
            // 复制失败提示（兼容老浏览器）
            copyTipEl.textContent = '复制失败，请手动选中复制！';
            copyTipEl.className = 'tip fail-tip';
            copyTipEl.style.display = 'block';
            // 备选方案：手动选中内容
            resultUrlsEl.select();
            document.execCommand('copy');
          })
          .finally(() => {
            // 3秒后自动隐藏提示
            setTimeout(() => {
              copyTipEl.style.display = 'none';
            }, 3000);
          });
      }

      generateBtn.addEventListener('click', function() {
        resultUrlsEl.value = '';
        errorMsgEl.textContent = '';
        copyTipEl.style.display = 'none'; // 清空复制提示

        const sourceUrl = sourceUrlEl.value.trim();
        const channelCount = parseInt(channelCountEl.value, 10);

        if (!sourceUrl) {
          errorMsgEl.textContent = '请先输入原始FLV链接';
          return;
        }
        if (isNaN(channelCount) || channelCount < 1) {
          errorMsgEl.textContent = '通道数量至少为1';
          return;
        }

        try {
          const result = generateChannelUrls(sourceUrl, channelCount);
          resultUrlsEl.value = result;
        } catch (err) {
          errorMsgEl.textContent = '生成失败：' + err.message;
        }
      });

      // 绑定复制按钮点击事件
      copyBtn.addEventListener('click', copyResultContent);
    });
  </script>
</body>
</html>
